        </svg>
      ),
    };

    // Custom syntax highlighter & code formatter for marked
    const renderer = new marked.Renderer();
    renderer.code = function(tokenOrCode, maybeLang) {
      let code = '';
      let lang = '';
      if (typeof tokenOrCode === 'object' && tokenOrCode !== null) {
        code = tokenOrCode.text || tokenOrCode.raw || '';
        lang = tokenOrCode.lang || '';
      } else {
        code = tokenOrCode || '';
        lang = maybeLang || '';
      }

      if (typeof code !== 'string') code = String(code);

      const language = lang && window.hljs && window.hljs.getLanguage(lang) ? lang : '';
      let highlighted = code;
      if (window.hljs) {
        try {
          highlighted = language 
            ? window.hljs.highlight(code, { language }).value 
            : window.hljs.highlightAuto(code).value;
        } catch (e) {
          highlighted = code;
        }
      }
      const langLabel = (language || lang || 'CODE').toUpperCase();
      const codeId = 'code_' + Math.random().toString(36).substring(2, 9);
      
      return `
        <div class="code-block-wrapper my-3 rounded-xl overflow-hidden border border-[#333333] bg-[#121212] text-left" dir="ltr">
          <div class="flex items-center justify-between px-3.5 py-1.5 bg-[#1c1c1f] border-b border-[#333333] text-[11px] text-[#a0acb7] font-mono select-none">
            <span class="font-semibold text-[#38bdf8]">${langLabel}</span>
            <button onclick="window.copyCodeBlock('${codeId}')" class="flex items-center gap-1 hover:text-white transition px-2.5 py-0.5 rounded bg-[#2a2a2a] hover:bg-[#333333] text-[#eeeeee]">
              <span id="btn_${codeId}">کپی کد</span>
            </button>
          </div>
          <pre class="p-3.5 overflow-x-auto text-xs leading-relaxed font-mono"><code id="${codeId}" class="hljs ${language}">${highlighted}</code></pre>
        </div>
      `;
    };
    marked.use({ renderer, breaks: true, gfm: true });

    window.copyCodeBlock = function(id) {
      const elem = document.getElementById(id);
      if (!elem) return;
      const text = elem.innerText || elem.textContent;
      navigator.clipboard.writeText(text);
      const btn = document.getElementById('btn_' + id);
      if (btn) {
        btn.innerText = 'کپی شد';
        setTimeout(() => { btn.innerText = 'کپی کد'; }, 2000);
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('chat');
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('liara_auth_user');
          return saved ? JSON.parse(saved) : null;
        } catch { return null; }
      });
      const [authToken, setAuthToken] = useState(() => localStorage.getItem('liara_auth_token') || '');
      const [showAuthModal, setShowAuthModal] = useState(false);

      const [sessions, setSessions] = useState(() => {
        try {
          const saved = localStorage.getItem('liara_sessions_store');
          return saved ? JSON.parse(saved) : [{ id: 'sess_1', title: 'گفتگوی جاری', messages: [] }];
        } catch {
          return [{ id: 'sess_1', title: 'گفتگوی جاری', messages: [] }];
        }
      });
      const [activeSessionId, setActiveSessionId] = useState(() => sessions[0]?.id || 'sess_1');
      const [streamingBuffer, setStreamingBuffer] = useState('');
      const [isStreaming, setIsStreaming] = useState(false);
      const [isWsConnected, setIsWsConnected] = useState(false);

      const wsRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem('liara_sessions_store', JSON.stringify(sessions));
        } catch {}
      }, [sessions]);

      // Check current user validity with token
      useEffect(() => {
        if (authToken) {
          fetch('/api/auth/me', {
            headers: { 'Authorization': `Bearer ${authToken}` }
          })
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data && data.user) {
              setCurrentUser(data.user);
              localStorage.setItem('liara_auth_user', JSON.stringify(data.user));
            } else {
              handleLogout();
            }
          })
          .catch(() => {});
        }
      }, [authToken]);

      const handleLoginSuccess = (token, user) => {
        setAuthToken(token);
        setCurrentUser(user);
        localStorage.setItem('liara_auth_token', token);
        localStorage.setItem('liara_auth_user', JSON.stringify(user));
        setShowAuthModal(false);
      };

      const handleLogout = () => {
        setAuthToken('');
        setCurrentUser(null);
        localStorage.removeItem('liara_auth_token');
        localStorage.removeItem('liara_auth_user');
        if (activeTab === 'admin') setActiveTab('chat');
      };

      const currentSession = sessions.find(s => s.id === activeSessionId) || sessions[0];
      const messages = currentSession ? currentSession.messages : [];

      const updateSessionMessages = (updater) => {
        setSessions(prevSessions =>
          prevSessions.map(s => {
            if (s.id === activeSessionId) {
              const newMessages = typeof updater === 'function' ? updater(s.messages) : updater;
              let newTitle = s.title;
              if (s.title === 'گفتگوی جاری' || s.title === 'گفتگوی جدید') {
                const firstUser = newMessages.find(m => m.role === 'user');
                if (firstUser) {
                  newTitle = firstUser.content.slice(0, 32) + (firstUser.content.length > 32 ? '...' : '');
                }
              }
              return { ...s, messages: newMessages, title: newTitle };
            }
            return s;
          })
        );
      };

      useEffect(() => {
        let ws;
        const connectWS = () => {
          try {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat${authToken ? '?token=' + authToken : ''}`;
            ws = new WebSocket(wsUrl);
            wsRef.current = ws;

            ws.onopen = () => setIsWsConnected(true);
            ws.onmessage = (event) => {
              try {
                const data = JSON.parse(event.data);
                handleIncomingStream(data);
              } catch (e) {
                console.error('Error parsing WS message', e);
              }
            };
            ws.onclose = () => {
              setIsWsConnected(false);
              setTimeout(connectWS, 3000);
            };
            ws.onerror = () => ws.close();
          } catch (err) {
            setIsWsConnected(false);
          }
        };

        connectWS();
        return () => { if (ws) ws.close(); };
      }, [activeSessionId, authToken]);

      const handleIncomingStream = (data) => {
        if (data.type === 'token') {
          setIsStreaming(true);
          setStreamingBuffer(prev => prev + data.token);
        } else if (data.type === 'done') {
          setIsStreaming(false);
          setStreamingBuffer('');
          updateSessionMessages(prev => [
            ...prev,
            {
              role: 'assistant',
              content: data.message,
              sources: data.sources,
              suggested_next: data.suggested_next,
              duration_ms: data.duration_ms,
            }
          ]);
        } else if (data.type === 'error') {
          setIsStreaming(false);
          setStreamingBuffer('');
          updateSessionMessages(prev => [
            ...prev,
            { role: 'assistant', content: `**خطا:** ${data.error || 'خطای پردازش درخواست'}` }
          ]);
        }
      };

      const handleSendMessage = async (text) => {
        if (!text || isStreaming) return;

        updateSessionMessages(prev => [...prev, { role: 'user', content: text }]);
        setStreamingBuffer('');
        setIsStreaming(true);

        if (isWsConnected && wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify({
            message: text,
            session_id: activeSessionId,
          }));
        } else {
          try {
            const headers = {
              'Content-Type': 'application/json',
              'Accept': 'text/event-stream'
            };
            if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

            const res = await fetch('/api/chat?stream=true', {
              method: 'POST',
              headers: headers,
              body: JSON.stringify({
                message: text,
                session_id: activeSessionId,
              })
            });

            if (!res.ok) {
              const raw = await res.text();
              throw new Error(raw || 'خطای ارتباط با سرور');
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let partial = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

              partial += decoder.decode(value, { stream: true });
              const lines = partial.split('\n');
              partial = lines.pop() || '';

              for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed || !trimmed.startsWith('data:')) continue;
                const jsonStr = trimmed.replace(/^data:\s*/, '');
                try {
                  const data = JSON.parse(jsonStr);
                  handleIncomingStream(data);
                } catch (e) {}
              }
            }
          } catch (err) {
            setIsStreaming(false);
            setStreamingBuffer('');
            updateSessionMessages(prev => [
              ...prev,
              { role: 'assistant', content: `**خطا در ارتباط با سرور:**\n\n${err.message}` }
            ]);
          }
        }

      const handleNewSession = () => {
        const newId = 'sess_' + Math.random().toString(36).substring(2, 9);
        const newSession = { id: newId, title: 'گفتگوی جدید', messages: [] };
        setSessions(prev => [newSession, ...prev]);
        setActiveSessionId(newId);
        setStreamingBuffer('');
        setIsStreaming(false);
        setActiveTab('chat');
      };

      const handleDeleteSession = (sessId) => {
        setSessions(prev => {
          const filtered = prev.filter(s => s.id !== sessId);
          if (filtered.length === 0) {
            const fresh = { id: 'sess_' + Math.random().toString(36).substring(2, 9), title: 'گفتگوی جدید', messages: [] };
            setActiveSessionId(fresh.id);
            return [fresh];
          }
          if (activeSessionId === sessId) {
            setActiveSessionId(filtered[0].id);
          }
          return filtered;
        });
      };

            <div className="flex items-center gap-2.5">
              <button

                  <button

          {/* Body */}

                  <Icons.Plus className="w-4 h-4" />
                  <span>شروع گفتگوی جدید</span>

                  <nav className="space-y-1">
                    {[
                      { id: 'chat', label: 'دستیار گفتگو', icon: Icons.Chat },
                      { id: 'config', label: 'سازنده کانفیگ liara.json', icon: Icons.Config },
                      { id: 'logs', label: 'عیب‌یاب و تحلیل لاگ', icon: Icons.Bug },
                      { id: 'docs', label: 'بانک مستندات رسمی', icon: Icons.Book },
                    ].map(item => {
                      const Icon = item.icon;
                      const isActive = activeTab === item.id;
                      return (
                        <button

                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium transition ${

                    {/* Admin Dashboard Tab (Only if admin) */}
                    {currentUser && currentUser.role === 'admin' && (
                      <button

                        className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium transition ${

    // Auth Modal Component (Login / Register)
    function AuthModalComponent({ onClose, onSuccess }) {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [error, setError] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setIsLoading(true);

        const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
        const body = isLogin ? { email, password } : { email, password, name };

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || 'خطا در احراز هویت');
          }
          onSuccess(data.token, data.user);
        } catch (err) {
          setError(err.message);
        } finally {
          setIsLoading(false);
        }
      };

      const fillPreset = (em, pass) => {
        setEmail(em);
        setPassword(pass);
        setIsLogin(true);
      };

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="liara-panel max-w-md w-full p-6 space-y-5 bg-[#222222] border border-[#ffffff20]">
            <div className="flex items-center justify-between border-b border-[#ffffff15] pb-3">
              <h3 className="text-base font-bold text-white flex items-center gap-2">
                <Icons.User className="w-5 h-5 text-[#0076ff]" />
                <span>{isLogin ? 'ورود به حساب کاربری' : 'ثبت‌نام کاربر جدید'}</span>
              </h3>
              <button onClick={onClose} className="text-[#a0acb7] hover:text-white text-lg font-bold">×</button>
            </div>

            {/* Mode Switch Tabs */}
            <div className="flex border-b border-[#ffffff15]">
              <button
                onClick={() => { setIsLogin(true); setError(''); }}
                className={`flex-1 py-2 text-xs font-semibold border-b-2 transition ${
                  isLogin ? 'border-[#0076ff] text-white' : 'border-transparent text-[#a0acb7]'
                }`}
              >
                ورود (Login)
              </button>
              <button
                onClick={() => { setIsLogin(false); setError(''); }}
                className={`flex-1 py-2 text-xs font-semibold border-b-2 transition ${
                  !isLogin ? 'border-[#0076ff] text-white' : 'border-transparent text-[#a0acb7]'
                }`}
              >
                ثبت‌نام (Register)
              </button>
            </div>

            {error && (
              <div className="p-3 bg-rose-500/15 border border-rose-500/30 rounded-xl text-rose-300 text-xs">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              {!isLogin && (
                <div>
                  <label className="text-xs text-[#a0acb7] block mb-1">نام و نام خانوادگی</label>
                  <input
                    type="text"
                    value={name}
                    onChange={e => setName(e.target.value)}
                    placeholder="مثال: علی رضایی"
                    className="w-full bg-[#181818] border border-[#333333] focus:border-[#0076ff] text-xs rounded-xl p-3 text-white outline-none"
                  />
                </div>
              )}

              <div>
                <label className="text-xs text-[#a0acb7] block mb-1">ایمیل</label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  placeholder="name@example.com"
                  className="w-full bg-[#181818] border border-[#333333] focus:border-[#0076ff] text-xs rounded-xl p-3 text-white outline-none font-mono text-left"
                  dir="ltr"
                />
              </div>

              <div>
                <label className="text-xs text-[#a0acb7] block mb-1">کلمه عبور</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full bg-[#181818] border border-[#333333] focus:border-[#0076ff] text-xs rounded-xl p-3 text-white outline-none font-mono text-left"
                  dir="ltr"
                />
              </div>

              <button
                type="submit"
                disabled={isLoading}
                className="w-full liara-btn-primary py-3 rounded-xl text-xs font-bold shadow-md disabled:opacity-50"
              >
                {isLoading ? 'در حال پردازش...' : (isLogin ? 'ورود به سامانه' : 'ایجاد حساب کاربری')}
              </button>
            </form>

            {/* Quick Demo Credentials */}
            <div className="pt-3 border-t border-[#ffffff15] text-[11px] text-[#a0acb7] space-y-1.5">
              <p className="font-semibold text-[#eeeeee]">حساب‌های پیش‌فرض تست:</p>
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => fillPreset('admin@liara.ir', 'Admin@Liara2026!')}
                  className="flex-1 p-2 bg-[#181818] hover:bg-[#282828] border border-[#ffffff15] rounded-lg text-emerald-400 font-mono text-[10px]"
                >
                  Admin (مدیر سیستم)
                </button>
                <button
                  type="button"
                  onClick={() => fillPreset('user@liara.ir', 'User@Liara2026!')}
                  className="flex-1 p-2 bg-[#181818] hover:bg-[#282828] border border-[#ffffff15] rounded-lg text-[#38bdf8] font-mono text-[10px]"
                >
                  User (کاربر عادی)
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Admin Dashboard Component: AI Request Logs & Token Consumption
    function AdminDashboardComponent({ authToken }) {
      const [stats, setStats] = useState(null);
      const [logs, setLogs] = useState([]);
      const [totalLogs, setTotalLogs] = useState(0);
      const [isLoading, setIsLoading] = useState(true);
      const [selectedLog, setSelectedLog] = useState(null);

      // Dynamic AI & Pricing Settings
      const [temperature, setTemperature] = useState(0.3);
      const [inputCostPerM, setInputCostPerM] = useState(0.150);
      const [outputCostPerM, setOutputCostPerM] = useState(0.600);
      const [usdToTomanRate, setUsdToTomanRate] = useState(90000);
      const [isSavingSettings, setIsSavingSettings] = useState(false);
      const [settingsSaved, setSettingsSaved] = useState(false);

      const fetchData = async () => {
        setIsLoading(true);
        try {
          const [statsRes, logsRes, settingsRes] = await Promise.all([
            fetch('/api/admin/stats', { headers: { 'Authorization': `Bearer ${authToken}` } }),
            fetch('/api/admin/logs?limit=50', { headers: { 'Authorization': `Bearer ${authToken}` } }),
            fetch('/api/admin/settings', { headers: { 'Authorization': `Bearer ${authToken}` } }),
          ]);
          if (statsRes.ok) setStats(await statsRes.json());
          if (logsRes.ok) {
            const data = await logsRes.json();
            setLogs(data.logs || []);
            setTotalLogs(data.total || 0);
          }
          if (settingsRes.ok) {
            const s = await settingsRes.json();
            if (s.temperature !== undefined) setTemperature(s.temperature);
            if (s.input_cost_per_m !== undefined) setInputCostPerM(s.input_cost_per_m);
            if (s.output_cost_per_m !== undefined) setOutputCostPerM(s.output_cost_per_m);
            if (s.usd_to_toman_rate !== undefined) setUsdToTomanRate(s.usd_to_toman_rate);
          }
        } catch (e) {
          console.error('Failed to fetch admin metrics', e);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, [authToken]);

      const handleSaveSettings = async () => {
        setIsSavingSettings(true);
        try {
          const res = await fetch('/api/admin/settings', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({
              temperature: parseFloat(temperature),
              input_cost_per_m: parseFloat(inputCostPerM),
              output_cost_per_m: parseFloat(outputCostPerM),
              usd_to_toman_rate: parseFloat(usdToTomanRate)
            })
          });
          if (res.ok) {
            setSettingsSaved(true);
            setTimeout(() => setSettingsSaved(false), 3000);
            const statsRes = await fetch('/api/admin/stats', { headers: { 'Authorization': `Bearer ${authToken}` } });
            if (statsRes.ok) setStats(await statsRes.json());
          }
        } catch (e) {
          console.error('Failed to save settings', e);
        } finally {
          setIsSavingSettings(false);
        }
      };

      const applyPreset = (inputCost, outputCost) => {
        setInputCostPerM(inputCost);
        setOutputCostPerM(outputCost);
      };

      return (
        <div className="flex-1 overflow-y-auto p-4 md:p-6 bg-[#181818] space-y-6">
          <div className="max-w-6xl w-full mx-auto space-y-6">
            {/* Header */}
            <div className="flex items-center justify-between pb-4 border-b border-[#ffffff15]">
              <div>
                <h2 className="text-base font-bold text-white flex items-center gap-2">
                  <Icons.Shield className="w-5 h-5 text-emerald-400" />
                  <span>داشبورد مانیتورینگ مصرف توکن‌ها و لاگ‌های هوش مصنوعی</span>
                </h2>
                <p className="text-xs text-[#a0acb7] mt-1">تنظیمات پارامترهای AI، ضرایب قیمت‌گذاری توکن‌ها و بررسی هزینه‌ها در دیتابیس PostgreSQL</p>
              </div>
              <button
                onClick={fetchData}
                className="liara-btn-ghost px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5"
              >
                <Icons.Refresh className="w-3.5 h-3.5" />
                <span>بروزرسانی داده‌ها</span>
              </button>
            </div>

            {/* Summary Stat Cards */}
            {stats && (
              <div className="grid grid-cols-2 lg:grid-cols-5 gap-3.5">
                <div className="liara-panel p-4 space-y-1">
                  <span className="text-[11px] text-[#a0acb7]">مجموع توکن‌های مصرفی</span>
                  <div className="text-lg font-bold text-white font-mono">
                    {stats.total_tokens.toLocaleString()}
                  </div>
                  <span className="text-[10px] text-emerald-400">کل ورودی و خروجی</span>
                </div>

                <div className="liara-panel p-4 space-y-1">
                  <span className="text-[11px] text-[#a0acb7]">توکن‌های ورودی (Prompt)</span>
                  <div className="text-lg font-bold text-[#38bdf8] font-mono">
                    {stats.total_prompt_tokens.toLocaleString()}
                  </div>
                  <span className="text-[10px] text-[#a0acb7]">Context & Docs</span>
                </div>

                <div className="liara-panel p-4 space-y-1">
                  <span className="text-[11px] text-[#a0acb7]">توکن‌های خروجی (Gen)</span>
                  <div className="text-lg font-bold text-amber-400 font-mono">
                    {stats.total_completion_tokens.toLocaleString()}
                  </div>
                  <span className="text-[10px] text-[#a0acb7]">پاسخ‌های مدل</span>
                </div>

                <div className="liara-panel p-4 space-y-1">
                  <span className="text-[11px] text-[#a0acb7]">هزینه کل (دلار)</span>
                  <div className="text-lg font-bold text-emerald-400 font-mono">
                    ${stats.estimated_cost_usd ? stats.estimated_cost_usd.toFixed(4) : '0.0000'}
                  </div>
                  <span className="text-[10px] text-[#7a8a94]">بر اساس نرخ تنظیمی</span>
                </div>

                <div className="liara-panel p-4 space-y-1">
                  <span className="text-[11px] text-[#a0acb7]">هزینه کل (تومان)</span>
                  <div className="text-lg font-bold text-[#87fcc4] font-mono">
                    {stats.estimated_cost_toman ? Math.round(stats.estimated_cost_toman).toLocaleString() : '۰'} <span className="text-xs font-sans">تومان</span>
                  </div>
                  <span className="text-[10px] text-[#7a8a94]">دلار {usdToTomanRate.toLocaleString()} ت</span>
                </div>
              </div>
            )}

            {/* AI Settings & Pricing Multipliers Card */}
            <div className="liara-panel p-5 space-y-5 bg-[#1e1e22]">
              <div className="flex items-center justify-between pb-3 border-b border-[#ffffff15]">
                <h3 className="text-sm font-bold text-white">پیکربندی هوش مصنوعی و ضرایب هزینه (per 1 Million Tokens)</h3>
                <button

    function ConfigStudioComponent({ authToken }) {
      const [platform, setPlatform] = useState('node');
      const [appName, setAppName] = useState('my-app');
      const [port, setPort] = useState('3000');
      const [healthCheck, setHealthCheck] = useState('/healthz');
      const [disks, setDisks] = useState([{ name: 'app-data', mountTo: '/app/storage' }]);
      const [activeView, setActiveView] = useState('json');
      const [copied, setCopied] = useState(false);
      const [isManualEdit, setIsManualEdit] = useState(false);

      // Code editor states
      const [editorMode, setEditorMode] = useState('normal'); // 'normal' | 'vim'
      const [vimState, setVimState] = useState('NORMAL'); // 'NORMAL' | 'INSERT' | 'COMMAND'
      const [vimCommand, setVimCommand] = useState('');
      const [vimStatusMsg, setVimStatusMsg] = useState('حالت نرمال - برای ویرایش کلید i را بزنید');
      const [jsonCode, setJsonCode] = useState('');
      const [dockerCode, setDockerCode] = useState('');
      const [cursorPos, setCursorPos] = useState({ line: 1, col: 1 });
      const [clipboardBuffer, setClipboardBuffer] = useState('');
      const [historyStack, setHistoryStack] = useState([]);

      const textareaRef = React.useRef(null);
      const lineNumbersRef = React.useRef(null);
      const lastKeyRef = React.useRef('');

      const platforms = [
        { id: 'node', label: 'Node.js', defaultPort: '3000' },
        { id: 'next', label: 'Next.js', defaultPort: '3000' },
        { id: 'laravel', label: 'Laravel', defaultPort: '80' },
        { id: 'django', label: 'Django', defaultPort: '80' },
        { id: 'fastapi', label: 'FastAPI', defaultPort: '8000' },
        { id: 'go', label: 'Go (Golang)', defaultPort: '8080' },
        { id: 'docker', label: 'Docker', defaultPort: '8080' },
        { id: 'static', label: 'Static', defaultPort: '80' },
      ];

      const handlePlatformChange = (pId) => {
        setPlatform(pId);
        const target = platforms.find(p => p.id === pId);
        if (target) {
          setPort(target.defaultPort);
          if (pId === 'laravel') setDisks([{ name: 'storage-disk', mountTo: 'storage' }]);
          else if (pId === 'django') setDisks([{ name: 'media-disk', mountTo: 'media' }]);
        }
        setIsManualEdit(false);
      };

      const buildConfigObj = () => ({
        app: appName || 'my-app',
        platform: platform,
        port: parseInt(port, 10) || 3000,
        healthCheck: healthCheck ? { path: healthCheck } : undefined,
        disks: disks.length > 0 ? disks : undefined,
      });

      const buildDockerfile = () => {
        if (platform === 'go') {
          return `FROM golang:1.23-alpine AS builder\nWORKDIR /app\nCOPY go.* ./\nRUN go mod download\nCOPY . .\nRUN CGO_ENABLED=0 go build -o main .\n\nFROM alpine:latest\nWORKDIR /app\nCOPY --from=builder /app/main .\nEXPOSE ${port}\nCMD ["./main"]`;
        }
        return `FROM node:20-alpine\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci --only=production\nCOPY . .\nEXPOSE ${port}\nCMD ["npm", "start"]`;
      };

      useEffect(() => {
        if (!isManualEdit) {
          setJsonCode(JSON.stringify(buildConfigObj(), null, 2));
          setDockerCode(buildDockerfile());
        }
      }, [platform, appName, port, healthCheck, disks, isManualEdit]);

      const currentCode = activeView === 'json' ? jsonCode : dockerCode;

      const setCurrentCode = (newCode) => {
        setHistoryStack(prev => [...prev.slice(-30), currentCode]);
        setIsManualEdit(true);
        if (activeView === 'json') setJsonCode(newCode);
        else setDockerCode(newCode);
      };

      const handleCopy = () => {
        navigator.clipboard.writeText(currentCode);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const handleDownload = () => {
        const filename = activeView === 'json' ? 'liara.json' : 'Dockerfile';
        const blob = new Blob([currentCode], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        setVimStatusMsg(`"${filename}" دانلود شد`);
      };

      const updateCursorPosition = () => {
        if (!textareaRef.current) return;
        const { selectionStart, value } = textareaRef.current;
        const textUpToCursor = value.substring(0, selectionStart);
        const lines = textUpToCursor.split('\n');
        setCursorPos({ line: lines.length, col: lines[lines.length - 1].length + 1 });
      };

      const handleScroll = (e) => {
        if (lineNumbersRef.current) lineNumbersRef.current.scrollTop = e.target.scrollTop;
      };

      const handleKeyDown = (e) => {
        const textarea = textareaRef.current;
        if (!textarea) return;
        const { selectionStart, selectionEnd, value } = textarea;

        if (e.key === 'Tab') {
          e.preventDefault();
          const newValue = value.substring(0, selectionStart) + '  ' + value.substring(selectionEnd);
          setCurrentCode(newValue);
          setTimeout(() => {
            textarea.selectionStart = textarea.selectionEnd = selectionStart + 2;
            updateCursorPosition();
          }, 0);
          return;
        }

        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          handleDownload();
          return;
        }

        if (editorMode === 'vim') {
          if (vimState === 'INSERT') {
            if (e.key === 'Escape') {
              e.preventDefault();
              setVimState('NORMAL');
              setVimStatusMsg('-- NORMAL --');
              textarea.blur();
            }
            return;
          }

          if (vimState === 'NORMAL') {
            e.preventDefault();
            if (e.key === 'i') {
              setVimState('INSERT');
              setVimStatusMsg('-- INSERT --');
              textarea.focus();
              return;
            }
            if (e.key === 'a') {
              setVimState('INSERT');
              setVimStatusMsg('-- INSERT --');
              textarea.focus();
              textarea.selectionStart = textarea.selectionEnd = Math.min(value.length, selectionStart + 1);
              updateCursorPosition();
              return;
            }
            if (e.key === 'h' || e.key === 'ArrowLeft') {
              textarea.selectionStart = textarea.selectionEnd = Math.max(0, selectionStart - 1);
              updateCursorPosition();
              return;
            }
            if (e.key === 'l' || e.key === 'ArrowRight') {
              textarea.selectionStart = textarea.selectionEnd = Math.min(value.length, selectionStart + 1);
              updateCursorPosition();
              return;
            }
            if (e.key === 'x') {
              if (selectionStart < value.length) {
                const newValue = value.substring(0, selectionStart) + value.substring(selectionStart + 1);
                setCurrentCode(newValue);
                setTimeout(() => {
                  textarea.selectionStart = textarea.selectionEnd = selectionStart;
                  updateCursorPosition();
                }, 0);
              }
              return;
            }
            if (e.key === 'u') {
              if (historyStack.length > 0) {
                const prev = historyStack[historyStack.length - 1];
                setHistoryStack(historyStack.slice(0, -1));
                if (activeView === 'json') setJsonCode(prev);
                else setDockerCode(prev);
                setVimStatusMsg('1 change undone');
              }
              return;
            }
            if (e.key === ':') {
              setVimState('COMMAND');
              setVimCommand(':');
              return;
            }
          }

          if (vimState === 'COMMAND') {
            if (e.key === 'Escape') {
              e.preventDefault();
              setVimState('NORMAL');
              setVimCommand('');
              setVimStatusMsg('-- NORMAL --');
              return;
            }
            if (e.key === 'Enter') {
              e.preventDefault();
              const cmd = vimCommand.trim();
              if (cmd === ':w' || cmd === ':wq') handleDownload();
              else if (cmd === ':q') setVimStatusMsg('Quit command mode');
              else setVimStatusMsg('Command: ' + cmd);
              setVimState('NORMAL');
              setVimCommand('');
              return;
            }
            if (e.key === 'Backspace') {
              e.preventDefault();
              if (vimCommand.length <= 1) {
                setVimState('NORMAL');
                setVimCommand('');
              } else {
                setVimCommand(vimCommand.slice(0, -1));
              }
              return;
            }
            if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
              e.preventDefault();
              setVimCommand(vimCommand + e.key);
            }
          }
        }
      };

      const lineCount = (currentCode.match(/\n/g) || []).length + 1;
      const lineNumbers = Array.from({ length: lineCount }, (_, i) => i + 1);

      return (
        <div className="flex-1 overflow-y-auto p-4 md:p-6 bg-[#181818]">
          <div className="max-w-6xl w-full mx-auto space-y-6">
            <div className="flex items-center justify-between pb-4 border-b border-[#ffffff15]">
              <div>
                <h2 className="text-base font-bold text-white flex items-center gap-2">
                  <Icons.Config className="w-5 h-5 text-[#0076ff]" />
                  <span>استودیوی تولید کانفیگ <span className="liara-gradient-text">liara.json</span> و Dockerfile</span>
                </h2>
                <p className="text-xs text-[#a0acb7] mt-1">تولید و ویرایش تعاملی فایل تنظیمات با قابلیت Vim Mode و اعتبارسنجی زنده</p>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={handleCopy} className="liara-btn-ghost text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                  {copied ? <Icons.Check className="w-3.5 h-3.5 text-emerald-400" /> : <Icons.Copy className="w-3.5 h-3.5" />}
                  <span>{copied ? 'کپی شد' : 'کپی فایل'}</span>
                </button>
                <button onClick={handleDownload} className="liara-btn-primary text-xs px-3.5 py-1.5 rounded-lg font-medium shadow transition flex items-center gap-1.5">
                  <Icons.Download className="w-3.5 h-3.5" />
                  <span>دانلود فایل</span>
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-6 space-y-4">
                <div className="liara-panel p-4 space-y-3">
                  <label className="text-xs font-semibold text-[#eeeeee] block">۱. پلتفرم برنامه</label>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {platforms.map(p => (
                      <button
                        key={p.id}
                        onClick={() => handlePlatformChange(p.id)}
                        className={`p-2.5 rounded-xl border text-xs font-medium transition ${
                          platform === p.id 
                            ? 'bg-gradient-to-r from-[#87fcc4] to-[#28c1f5] text-[#111827] font-bold shadow-md shadow-cyan-500/20 border-transparent' 
                            : 'bg-[#181818] border-[#ffffff15] text-[#a0acb7] hover:bg-[#282828]'
                        }`}
                      >
                        {p.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="liara-panel p-4 space-y-3">
                  <label className="text-xs font-semibold text-[#eeeeee] block">۲. مشخصات عمومی</label>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>

                </div>

                <div className="liara-panel p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <label className="text-xs font-semibold text-[#eeeeee]">۳. دیسک‌های ابری (Disks)</label>

                    </button>
                  </div>
                  {disks.map((d, i) => (
                    <div key={i} className="flex items-center gap-2">
                      <input

                        value={d.name}

                        placeholder="نام دیسک"
                      />
                      <span>←</span>
                      <input

                        onChange={e => { const copy = [...disks]; copy[i].mountTo = e.target.value; setDisks(copy); setIsManualEdit(false); }}
                        className="flex-1 bg-[#181818] border border-[#ffffff15] text-xs rounded-lg p-2 text-white font-mono outline-none"
                        placeholder="مسیر مانت"
                      />
                      <button onClick={() => { setDisks(disks.filter((_, idx) => idx !== i)); setIsManualEdit(false); }} className="text-rose-400 p-2">
                        <Icons.Trash className="w-3.5 h-3.5" />

                    </div>
                  ))}
                </div>
              </div>

              {/* Editor Box */}
              <div className="lg:col-span-6 space-y-4">
                <div className="liara-panel overflow-hidden flex flex-col h-[500px]">
                  <div className="bg-[#222222] border-b border-[#ffffff15] px-3.5 py-2 flex items-center justify-between select-none">
                    <div className="flex items-center gap-1.5">
                      <button

                  <div className="relative flex-1 flex overflow-hidden bg-[#101012]" dir="ltr">

                        <div key={n} className={n === cursorPos.line ? 'text-[#38bdf8] font-bold' : ''}>{n}</div>

                    <textarea
                      ref={textareaRef}

                      onChange={e => { setCurrentCode(e.target.value); updateCursorPosition(); }}
                      onKeyDown={handleKeyDown}

                      onClick={updateCursorPosition}
                      onScroll={handleScroll}

                      className="flex-1 p-3 bg-transparent text-[#38bdf8] font-mono text-xs leading-6 outline-none resize-none overflow-auto whitespace-pre tab-4"
                      style={{ tabSize: 2 }}

                      ) : (

                      )}
                    </div>
                    <div>سطر <b className="text-white">{cursorPos.line}</b>، ستون <b className="text-white">{cursorPos.col}</b></div>
                  </div>

                  <div className="p-3 bg-[#181818] border-t border-[#ffffff15]">
                    <p className="text-[11px] text-[#a0acb7] mb-1 font-sans">دستور استقرار در ترمینال:</p>

    // 3. Log Debugger Component
    function LogDebuggerComponent({ authToken }) {
      const [logInput, setLogInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [result, setResult] = useState(null);

      const presets = [
        { label: 'خطای 502 Bad Gateway', log: '2026/08/20 10:20:00 [error] connect() failed (111: Connection refused) while connecting to upstream' },
        { label: 'کمبود حافظه RAM', log: 'FATAL ERROR: JavaScript heap out of memory' },
        { label: 'عدم اتصال دیتابیس', log: 'Error: connect ECONNREFUSED 127.0.0.1:5432' },
      ];

      const handleAnalyze = async () => {
        if (!logInput.trim() || isLoading) return;
        setIsLoading(true);
        setResult(null);
        try {
          const headers = { 'Content-Type': 'application/json' };
          if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

          const res = await fetch('/api/tools/diagnose', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({ log: logInput.trim() })
          });
          const data = await res.json();
          setResult(data);
        } catch (e) {
          setResult({ error: 'خطا در ارتباط با سرویس عیب‌یاب' });
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="flex-1 overflow-y-auto p-4 md:p-6 bg-[#181818]">
          <div className="max-w-4xl w-full mx-auto space-y-5">
            <div className="pb-4 border-b border-[#ffffff15]">
              <h2 className="text-base font-bold text-white flex items-center gap-2">
                <Icons.Bug className="w-5 h-5 text-rose-500" />
                <span>عیب‌یاب و ریشه‌یاب خطاهای دیپلوی</span>
              </h2>
              <p className="text-xs text-[#a0acb7] mt-1">تحلیل خودکار لاگ‌های استقرار و خطاهای زمان اجرا با الگوهای اختصاصی لیارا</p>
            </div>

            <div className="space-y-2">
              <p className="text-[11px] font-semibold text-[#a0acb7]">نمونه خطاهای رایج:</p>
              <div className="flex flex-wrap gap-2">
                {presets.map((p, i) => (
                  <button
                    key={i}
                    onClick={() => setLogInput(p.log)}
                    className="text-xs bg-[#222222] hover:bg-[#282828] border border-[#ffffff15] text-[#eeeeee] px-3 py-1.5 rounded-lg transition"
                  >
                    {p.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="liara-panel p-4 space-y-3">
              <label className="text-xs font-semibold text-[#eeeeee] block">لاگ خطا یا خروجی ترمینال را وارد کنید:</label>
              <textarea
                rows={6}
                value={logInput}
                onChange={e => setLogInput(e.target.value)}
                placeholder="Log traceback or deployment output here..."
                className="w-full bg-[#181818] border border-[#333333] focus:border-[#0076ff] text-xs font-mono rounded-lg p-3 text-white outline-none"
              />
              <div className="flex justify-between items-center">
                <button onClick={() => { setLogInput(''); setResult(null); }} className="text-xs text-[#7a8a94] hover:text-white flex items-center gap-1">
                  <Icons.Refresh className="w-3.5 h-3.5" />
                  <span>پاک کردن</span>
                </button>
                <button
                  onClick={handleAnalyze}
                  disabled={!logInput.trim() || isLoading}
                  className="liara-btn-primary disabled:opacity-40 text-white px-4 py-2 rounded-lg text-xs font-semibold transition"
                >
                  {isLoading ? 'در حال تحلیل...' : 'تحلیل و عیب‌یابی خطا'}
                </button>
              </div>
            </div>

            {result && (
              <div className="liara-panel p-5 space-y-3 border-emerald-500/30">
                <h3 className="text-sm font-bold text-white">نتیجه عیب‌یابی و راهکار رفع مشکل:</h3>
                {result.data ? (
                  <div className="markdown-body" dangerouslySetInnerHTML={{ __html: marked.parse(result.data) }} />
                ) : (
                  <p className="text-rose-400 text-xs">{result.error || 'خطا در پردازش'}</p>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // 4. Docs Explorer Component
    function DocsExplorerComponent() {
      const [query, setQuery] = useState('');
      const [category, setCategory] = useState('');
      const [results, setResults] = useState([]);
      const [selectedDoc, setSelectedDoc] = useState(null);

      const categoriesList = [
        { id: '', label: 'همه مستندات' },
        { id: 'paas', label: 'پلتفرم (PaaS)' },
        { id: 'dbaas', label: 'دیتابیس‌ها (DBaaS)' },
        { id: 'ai', label: 'هوش مصنوعی (AI)' },
        { id: 'one-click-apps', label: 'برنامه‌های آماده' },
        { id: 'object-storage', label: 'ذخیره‌سازی ابری (S3)' },
        { id: 'email-server', label: 'سرور ایمیل' },
        { id: 'dns-management-system', label: 'دامنه و DNS' },
        { id: 'iaas', label: 'سرور ابری (IaaS)' },
        { id: 'references', label: 'منابع و CLI' },
        { id: 'overview', label: 'شروع و معرفی' },
      ];

      const getDocTitle = (item) => {
        if (!item) return 'مستند لیارا';
        const chunk = item.chunk || item;
        let t = chunk.title || chunk.doc_title || chunk.section_title || '';
        t = t.replace(/<title>|<\/title>|مستندات|لیارا|[-–|]/gi, ' ').trim();
        if (!t || t.trim() === '') {
          if (chunk.file_path) {
            t = chunk.file_path.split('/').pop().replace(/\.mdx?$/, '').replace(/[-_]/g, ' ');
          } else {
            t = 'مستند لیارا';
          }
        }
        return t.replace(/^[#\s]+/, '').replace(/####/g, '').trim();
      };

      const getCleanDocContent = (item) => {
        if (!item) return '';
        const chunk = item.chunk || item;
        let body = chunk.raw_body || chunk.content || '';
        body = body.replace(/^Title:\s*.*?\n/i, '');
        body = body.replace(/^Source:\s*.*?\n/i, '');
        body = body.replace(/import\s+.*?;\s*\n?/g, '');
        body = body.replace(/<title>.*?<\/title>/gi, '');
        body = body.replace(/\[####\s+/g, '[');
        body = body.replace(/\[###\s+/g, '[');
        body = body.replace(/\[##\s+/g, '[');
        body = body.replace(/\[#\s+/g, '[');

        // 1. Strip classNames and styles early to prevent Tailwind [#color] bracket collision
        body = body.replace(/className=["'][^"']*["']/g, '');
        body = body.replace(/style=\{\{[\s\S]*?\}\}/g, '');

        // 2. Convert <Step ...> and <Important>
        body = body.replace(/<Step\s+steps=\s*\{\s*\[/gi, '');
        body = body.replace(/step:\s*["']([^"']+)["']\s*,\s*content:\s*\(?/gi, '\n### مرحله $1\n\n');
        body = body.replace(/<Important>(.*?)<\/Important>/gi, ' `$1` ');

        // 3. Convert JS Map arrays if any residual
        body = body.replace(/\{?\s*\[[\s\S]*?\]\s*\.map\s*\([\s\S]*?\)\s*\}?/g, (match) => {
          const links = [];
          const linkRegex = /(?:text|title)\s*:\s*['"]([^'"]+)['"]\s*,\s*link\s*:\s*['"]([^'"]+)['"]/g;
          let m;
          while ((m = linkRegex.exec(match)) !== null) {
            links.push(`- [${m[1].trim()}](${m[2].trim()})`);
          }
          return links.length > 0 ? '\n' + links.join('\n') + '\n' : '';
        });

        // 4. Convert <Alert> to multi-line Markdown blockquote
        body = body.replace(/<Alert(?:\s+variant=['"][^'"]*['"])?>([\s\S]*?)<\/Alert>/gi, (_, alertContent) => {
          const cleanAlert = alertContent
            .replace(/<(?:Link|a)\s+[^>]*href=['"]([^'"]+)['"][^>]*>([\s\S]*?)<\/(?:Link|a)>/gi, (_, h, t) => `[${t.replace(/\s+/g, ' ').trim()}](${h.trim()})`)
            .trim();
          const lines = cleanAlert.split('\n').map(l => l.trim()).filter(Boolean);
          return '\n> **نکته:**\n' + lines.map(l => '> ' + l).join('\n') + '\n\n';
        });

        // 5. Convert <Link> and <a> tags to [Text](Href) on a single line
        body = body.replace(/<(?:Link|a)\s+[^>]*href=['"]([^'"]+)['"][^>]*>([\s\S]*?)<\/(?:Link|a)>/gi, (_, href, text) => {
          const cleanText = text.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
          const cleanHref = href.trim();
          return cleanText && cleanHref ? ` [${cleanText}](${cleanHref}) ` : '';
        });

        // 6. Remove leftover React components and JSX attributes
        body = body.replace(/<\/?[A-Z][a-zA-Z0-9_]*[^>]*>/g, '');
        body = body.replace(/key=\{[^\}]*\}/g, '');
        body = body.replace(/href=\{[^\}]*\}/g, '');
        body = body.replace(/\[?\s*\(?(?:item|platform|data)\s*,\s*index\)?\s*=>\s*\(?/g, '');
        body = body.replace(/\)?\s*=>\s*\(?/g, '');
        body = body.replace(/\{text:\s*/g, '');
        body = body.replace(/\}\s*\]\s*\}\s*\/?>/g, '');
        body = body.replace(/\/\s*>/g, '');
        body = body.replace(/^\s*[\(\)\[\]\{\}=><,;:/\\]+\s*$/gm, '');
        body = body.replace(/^\s*\*\*\s*$/gm, '');

        // 7. Clean consecutive empty lines
        body = body.replace(/\n{3,}/g, '\n\n');
        return body.trim();
      };

      useEffect(() => {
        const timer = setTimeout(async () => {
          try {
            const params = new URLSearchParams();
            if (query) params.append('q', query);
            if (category) params.append('category', category);
            const res = await fetch(`/api/docs/search?${params.toString()}`);
            if (res.ok) {
              const data = await res.json();
              setResults(data.results || []);
              if (data.results && data.results.length > 0) {
                setSelectedDoc(data.results[0]);
              } else {
                setSelectedDoc(null);
              }
            }
          } catch (e) {}
        }, 250);
        return () => clearTimeout(timer);
      }, [query, category]);

      return (
        <div className="flex-1 flex flex-col h-full p-4 md:p-6 overflow-hidden bg-[#181818]">
          <div className="max-w-6xl w-full mx-auto flex flex-col h-full space-y-3.5">
            <div className="space-y-3 pb-3 border-b border-[#ffffff15] shrink-0">
              <div className="flex items-center justify-between">
                <h2 className="text-base font-bold text-white flex items-center gap-2">
                  <Icons.Book className="w-5 h-5 text-[#0076ff]" />
                  <span>بانک مستندات و راهنماهای رسمی <span className="liara-gradient-text">لیارا</span></span>
                </h2>
                <span className="text-xs text-[#a0acb7]">
                  <b className="font-mono text-white ml-1 font-bold">{results.length}</b> مستند یافت شد
                </span>
              </div>

              <div className="relative">
                <input
                  type="text"
                  value={query}
                  onChange={e => setQuery(e.target.value)}
                  placeholder="جستجو در تمام مستندات، راهنماها و تنظیمات لیارا..."
                  className="w-full bg-[#222222] border border-[#333333] focus:border-[#0076ff] rounded-xl px-4 py-2.5 text-xs md:text-sm text-white outline-none placeholder:text-[#7a8a94]"
                />
              </div>

              <div className="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs select-none">
                {categoriesList.map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => setCategory(cat.id)}
                    className={`px-2.5 py-1 rounded-lg whitespace-nowrap transition text-[11px] font-medium ${
                      category === cat.id
                        ? 'bg-gradient-to-r from-[#87fcc4] to-[#28c1f5] text-[#111827] font-bold shadow-md shadow-cyan-500/20 border border-transparent'
                        : 'bg-[#222222] hover:bg-[#282828] text-[#a0acb7] hover:text-white border border-[#ffffff15]'
                    }`}
                  >
                    {cat.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex-1 grid grid-cols-1 md:grid-cols-12 gap-4 overflow-hidden min-h-0">
              <div className="md:col-span-5 flex flex-col h-full overflow-y-auto space-y-2 pr-1">
                {results.length === 0 && (
                  <div className="text-center py-12 text-xs text-[#7a8a94]">
                    مستندی در این دسته‌بندی یافت نشد.
                  </div>
                )}

                {results.map((item, idx) => {
                  const chunk = item.chunk || item;
                  const isSelected = selectedDoc && ((selectedDoc.id && selectedDoc.id === chunk.id) || selectedDoc === item);
                  const scorePercent = item.score ? Math.round(item.score * 100) : 0;
                  return (
                    <div
                      key={idx}
                      onClick={() => setSelectedDoc(item)}
                      className={`p-3.5 rounded-xl border text-right cursor-pointer transition ${
                        isSelected
                          ? 'bg-[#0076ff]/20 border-[#0076ff] text-white'
                          : 'bg-[#222222] border-[#ffffff15] hover:border-[#ffffff30] text-[#eeeeee]'
                      }`}
                    >
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-[10px] font-semibold text-[#38bdf8] font-mono uppercase">
                          {chunk.category || 'مستند'}
                        </span>
                        {scorePercent > 0 && query && (
                          <span className="text-[10px] text-[#7a8a94]">
                            تطابق: {scorePercent}%
                          </span>
                        )}
                      </div>

                      <h4 className="text-xs font-bold text-white line-clamp-1 mb-1">
                        {getDocTitle(item)}
                      </h4>

                      <p className="text-[11px] text-[#a0acb7] line-clamp-2 leading-relaxed">
                        {getCleanDocContent(item).replace(/[#*`]/g, '')}
                      </p>
                    </div>
                  );
                })}
              </div>

              <div className="md:col-span-7 flex flex-col h-full liara-panel p-5 overflow-y-auto">
                {selectedDoc ? (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between pb-3 border-b border-[#ffffff15]">
                      <div>
                        <div className="text-[10px] text-[#38bdf8] font-mono mb-0.5 uppercase">
                          {selectedDoc.chunk?.category || selectedDoc.category || 'مستند لیارا'}
                        </div>
                        <h3 className="text-sm font-bold text-white">
                          {getDocTitle(selectedDoc)}
                        </h3>
                      </div>

                      {(selectedDoc.chunk?.original_url || selectedDoc.original_url) && (
                        <a
                          href={selectedDoc.chunk?.original_url || selectedDoc.original_url}
                          target="_blank"
                          rel="noreferrer"
                          className="liara-btn-primary px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5 shadow-sm"
                        >
                          <span>مشاهده در سایت</span>
                          <Icons.ExternalLink className="w-3 h-3" />
                        </a>
                      )}
                    </div>

                    <div
                      className="markdown-body text-xs md:text-sm"
                      dangerouslySetInnerHTML={{
                        __html: marked.parse(getCleanDocContent(selectedDoc)),
                      }}
                    />
                  </div>
                ) : (
                  <div className="text-center py-20 text-xs text-[#7a8a94]">
                    یک مستند را از لیست انتخاب کنید تا متن کامل آن نمایش داده شود.
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
